<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Meta History</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Single Page Apps for GitHub Pages — decode the redirect from 404.html
      (function (l) {
        if (l.search.startsWith('?p=/') || l.search.includes('&p=/')) {
          var q = {};
          l.search.slice(1).split('&').forEach(function (kv) {
            var eq = kv.indexOf('=');
            var k = kv.slice(0, eq);
            var v = kv.slice(eq + 1).replace(/~and~/g, '&');
            q[k] = v;
          });
          var newPath = l.pathname + (q.p || '') + (q.q ? '?' + q.q : '') + l.hash;
          window.history.replaceState(null, '', newPath);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
